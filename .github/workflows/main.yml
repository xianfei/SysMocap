# main.yml

# Workflow's name
name: Build SysMocap For Win/Mac

# Workflow's trigger
on:
  push:
    tags:
      - 'v*.*.*'

# Workflow's jobs
jobs:
  # job's id
  release:
    # job's name
    name: build and release sysmocap
    
    # the type of machine to run the job on
    runs-on: ${{ matrix.os }}
    
    # create a build matrix for jobs
    strategy:
      matrix:
        os: [windows-2022, macos-14]

    steps:
      # step1: check out repository
      - name: Check out git repository
        uses: actions/checkout@v4

      # step2: install node env
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: setup python
        uses: actions/setup-python@v5
        if: matrix.os == 'macos-14'
        with:
          python-version: 3.12

      - name: setup appdmg
        if: matrix.os == 'macos-14'
        run: |
          python3 -m pip install setuptools
          npm install -g appdmg@0.6.6

      # step3: npm install
      - name: npm install
        run: |
          npm install

      # step4: build app for mac/win
      - name: build windows app
        if: matrix.os == 'windows-2022'
        run: |
          npm install electron-wix-msi
          npm run package:win64
          npm run 7z:win64
          npm run msix64
          npm run package:winarm
          npm run 7z:winarm
          npm run msixarm
        env:
          GH_TOKEN: ${{ secrets.SECRET_TOKEN }}

      - name: build mac app
        if: matrix.os == 'macos-14'
        run: |
          sed -i '' '137,149d' `npm root -g`/appdmg/lib/appdmg.js
          npm run package:mac64
          npm run dmg
          npm run package:macarm
          npm run dmgarm
        env:
          GH_TOKEN: ${{ secrets.SECRET_TOKEN }}

      # Artifacts are already version-stamped by the package scripts (they read
      # package.json's version via $npm_package_version / require(...)), so the old
      # git-describe rename steps are gone. Keep package.json's version in sync with
      # the release tag (e.g. tag v0.8.0 <-> "version": "0.8.0").

      # step6: upload artifacts
      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: OutApp/packages

      # step7: create release
      - name: release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: "OutApp/packages/**"
          # publish as a draft so a tag push doesn't immediately go public —
          # review the artifacts, then hit "Publish release" in the GitHub UI
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}